<div
  class="bg-white/80 backdrop-blur-xl shadow-lg rounded-3xl p-8 border border-white/50 w-full relative overflow-hidden group"
>
  <div class="relative z-10">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold bg-black bg-clip-text text-transparent">
        Create Account
      </h2>
      <p class="text-gray-500 mt-2">Join us to experience the best.</p>
    </div>

    @if (errorMsg) {
      <div
        class="bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-6 border border-red-100 flex items-center"
      >
        {{ errorMsg }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm" class="space-y-6">
      <div>
        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
        <input
          type="text"
          id="name"
          name="name"
          [(ngModel)]="userModel.name"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
          placeholder="John Doe"
        />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
          >Email Address</label
        >
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="userModel.email"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
          placeholder="you@example.com"
        />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="userModel.password"
          required
          class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white/50 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all outline-none"
          placeholder="••••••••"
        />
      </div>

      <button
        type="submit"
        [disabled]="!registerForm.form.valid"
        class="w-full bg-black hover:bg-white text-white hover:text-black font-bold py-3 px-4 rounded-xl transition-all transform hover:-translate-y-1 hover:shadow-lg disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none"
      >
        Sign Up
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-gray-600">
      <a routerLink="/login" class="font-semibold">Sign in</a>
    </div>
  </div>
</div>
