<div
  class="bg-white/80 backdrop-blur-xl shadow-2xl rounded-3xl p-8 border border-white/50 w-full max-w-lg mx-auto relative overflow-hidden group"
>
  <div class="relative z-10">
    <div class="flex items-center space-x-6 mb-8">
      <div
        class="h-24 w-24 rounded-full bg-gradient-to-r from-indigo-500 to-purple-500 p-1 shadow-lg shadow-indigo-500/30"
      >
        <div
          class="h-full w-full rounded-full bg-white flex items-center justify-center text-3xl font-bold text-indigo-600"
        >
          {{ userService.currentUser()?.name?.charAt(0) | uppercase }}
        </div>
      </div>
      <div>
        <h2 class="text-3xl font-bold text-gray-900">{{ userService.currentUser()?.name }}</h2>
        <p class="text-indigo-600 font-medium">Active Member</p>
      </div>
    </div>

    <div class="space-y-6">
      <div
        class="bg-gray-50/80 rounded-2xl p-5 border border-gray-100 shadow-sm transition-all hover:shadow-md"
      >
        <div class="flex items-center justify-between mb-2">
          <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">
            Contact Information
          </h3>
        </div>
        <p class="text-gray-900 font-medium break-all">{{ userService.currentUser()?.email }}</p>
      </div>
    </div>
  </div>
</div>
