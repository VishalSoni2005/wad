<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bootstrap Dashboard</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-3">
          <h3 class="text-white text-center mb-4">Admin Panel</h3>

          <ul class="nav flex-column">
            <li class="nav-item">
              <a class="nav-link active" href="#">
                <i class="bi bi-speedometer2"></i>
                Dashboard
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="bi bi-people"></i>
                Students
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="bi bi-book"></i>
                Courses
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="bi bi-file-earmark-text"></i>
                Exams
              </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="#">
                <i class="bi bi-gear"></i>
                Settings
              </a>
            </li>
          </ul>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 main-content">
          <!-- NAVBAR -->
          <nav class="navbar navbar-light bg-light px-3">
            <h4>College Dashboard</h4>

            <button class="btn btn-primary">Logout</button>
          </nav>

          <!-- CARDS -->
          <div class="container mt-4">
            <div class="row g-4">
              <!-- CARD 1 -->
              <div class="col-md-3">
                <div class="card text-center shadow">
                  <div class="card-body">
                    <i class="bi bi-people-fill icon text-primary"></i>

                    <h5 class="card-title mt-3">Students</h5>

                    <h2>1200</h2>
                  </div>
                </div>
              </div>

              <!-- CARD 2 -->
              <div class="col-md-3">
                <div class="card text-center shadow">
                  <div class="card-body">
                    <i class="bi bi-book-fill icon text-success"></i>

                    <h5 class="card-title mt-3">Courses</h5>

                    <h2>45</h2>
                  </div>
                </div>
              </div>

              <!-- CARD 3 -->
              <div class="col-md-3">
                <div class="card text-center shadow">
                  <div class="card-body">
                    <i class="bi bi-file-earmark-fill icon text-danger"></i>

                    <h5 class="card-title mt-3">Exams</h5>

                    <h2>18</h2>
                  </div>
                </div>
              </div>

              <!-- CARD 4 -->
              <div class="col-md-3">
                <div class="card text-center shadow">
                  <div class="card-body">
                    <i class="bi bi-person-check-fill icon text-warning"></i>

                    <h5 class="card-title mt-3">Faculty</h5>

                    <h2>85</h2>
                  </div>
                </div>
              </div>
            </div>

            <!-- TABLE -->
            <div class="mt-5">
              <h4>Recent Student Records</h4>

              <table class="table table-bordered mt-3">
                <thead class="table-dark">
                  <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Course</th>
                    <th>Status</th>
                  </tr>
                </thead>

                <tbody>
                  <tr>
                    <td>101</td>
                    <td>Vishal</td>
                    <td>Computer Engineering</td>
                    <td>
                      <span class="badge bg-success"> Active </span>
                    </td>
                  </tr>

                  <tr>
                    <td>102</td>
                    <td>Rahul</td>
                    <td>IT</td>
                    <td>
                      <span class="badge bg-warning"> Pending </span>
                    </td>
                  </tr>

                  <tr>
                    <td>103</td>
                    <td>Sneha</td>
                    <td>AIML</td>
                    <td>
                      <span class="badge bg-success"> Active </span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
